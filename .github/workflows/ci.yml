name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  tests:
    name: Run backend tests
    runs-on: ubuntu-latest

    env:
      FLASK_ENV: testing
      SECRET_KEY: test-secret-key
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: sqlite:///test.db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      GOOGLE_CLIENT_SECRET_FILE: backend/infrastructure/credentials.example.json
      GOOGLE_REDIRECT_URI: http://localhost:5000/callback
      OPENAI_API_KEY: test-key
      OPENAI_SCHEDULE_MODEL: gpt-4o
      SERPAPI_KEY: test-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install production dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Create fake Google credentials for CI
        run: |
          mkdir -p backend/infrastructure
          cat > backend/infrastructure/credentials.example.json <<'JSON'
          {
            "web": {
              "client_id": "test-client-id",
              "project_id": "test-project",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token",
              "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
              "client_secret": "test-client-secret",
              "redirect_uris": ["http://localhost:5000/callback"]
            }
          }
          JSON

      - name: Run tests with coverage
        run: |
          python -m pytest

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov
          if-no-files-found: ignore
